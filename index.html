<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자유의 여신상 · 스마트폰 Pop-out 3D</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b2a;color:#fff;font-family:system-ui,'Malgun Gothic',sans-serif}header{text-align:center;padding:12px 6px}h1{font-size:clamp(18px,3vw,28px);margin:0}header p{color:#a9c2d9;margin:4px}.viewer{width:min(98vw,1200px);height:min(72vh,760px);min-height:330px;margin:auto;position:relative;overflow:hidden;border:1px solid #35516d;border-radius:12px;background:linear-gradient(130deg,#233c55,#0b1726);touch-action:none}#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}#content{position:absolute;left:50%;top:50%;width:100%;aspect-ratio:1487/880;transform:translate(-50%,-50%);transform-origin:center center;touch-action:none;will-change:transform}#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}#gl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#msg{position:absolute;top:8px;left:8px;background:#07172ccf;border-radius:7px;padding:8px 12px;font-size:13px;max-width:85%}.buttons{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:12px auto;max-width:1150px;padding:0 8px}button{background:#294e70;color:white;border:1px solid #7198b7;border-radius:8px;padding:10px 12px;cursor:pointer}button:active{background:#4a7397}.tuning{max-width:900px;margin:4px auto 10px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;font-size:13px;color:#d6e8f5}.tuning label{display:flex;align-items:center;gap:6px}.tuning input{width:110px}footer{text-align:center;font-size:12px;color:#b8ccdc;padding:4px 8px 20px;line-height:1.6}
</style></head><body><header><h1>🗽 자유의 여신상 · 스마트폰 Pop-out 3D</h1><p>스마트폰 축소 · 자유의 여신상 정면 · 돌출 효과 확대</p></header><main><div class="viewer" id="viewer"><video id="video" autoplay muted playsinline></video><div id="content"><img id="bg" src="./liberty-phone-background.png" alt="뉴욕 항구가 표시된 스마트폰"><canvas id="gl"></canvas></div><div id="msg">3D 모델을 불러오는 중…</div></div><div class="buttons"><button id="camera">📷 카메라 켜기</button><button id="place">📍 위치 배치</button><button id="left">↶ 여신상 왼쪽</button><button id="right">↷ 여신상 오른쪽</button><button id="plus">＋ 전체 확대</button><button id="minus">－ 전체 축소</button><button id="reset">처음 위치</button></div><div class="tuning"><label>여신상 방향 <input id="yaw" type="range" min="-180" max="180" step="1" value="-119"><span id="yawVal">-119°</span></label><label>여신상 높이 <input id="height" type="range" min="420" max="1300" value="820" step="5"><span id="heightVal">820</span></label><label>좌우 <input id="posX" type="range" min="200" max="800" value="425" step="5"></label><label>상하 <input id="posY" type="range" min="500" max="850" value="760" step="5"></label></div><footer>한 손가락 드래그: 전체 이동 · 두 손가락: 전체 회전·확대/축소 · 여신상 방향 슬라이더: 얼굴 정면 맞춤<br>카메라를 켠 뒤 [위치 배치]를 누르고 화면을 터치하세요. 카메라 화면 위에 겹치는 합성 체험이며 실제 공간 추적 AR은 아닙니다.</footer></main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const W=1487,H=880,content=document.getElementById('content'),viewer=document.getElementById('viewer'),msg=document.getElementById('msg');
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(W,H,false);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setClearColor(0,0);
const scene=new THREE.Scene(),cam=new THREE.OrthographicCamera(-W/2,W/2,H/2,-H/2,.1,5000);cam.position.set(0,0,1500);cam.lookAt(0,0,0);scene.add(new THREE.HemisphereLight(0xffffff,0x657f83,3));const light=new THREE.DirectionalLight(0xfff7dc,3);light.position.set(-400,700,900);scene.add(light);
const pivot=new THREE.Group();scene.add(pivot);let model=null;
let yaw=-119,modelHeight=820,modelX=425,modelY=760;
function applyModel(){if(!model)return;/* 모델 원본 바운딩박스는 로딩 시 저장됨 */
 pivot.position.set(modelX-W/2,H/2-modelY,0);pivot.rotation.y=yaw*Math.PI/180;model.scale.setScalar(modelHeight/model.userData.sourceHeight);model.position.set(-model.userData.centerX*model.scale.x,-model.userData.minY*model.scale.y,-model.userData.centerZ*model.scale.z);}
new GLTFLoader().load('./statue_of_liberty_1.glb',g=>{model=g.scene;const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3());model.userData={sourceHeight:size.y,centerX:(box.min.x+box.max.x)/2,minY:box.min.y,centerZ:(box.min.z+box.max.z)/2};pivot.add(model);model.traverse(o=>{if(o.isMesh){o.frustumCulled=false}});applyModel();msg.textContent='자유의 여신상 GLB 로딩 완료';setTimeout(()=>msg.style.display='none',5000)},undefined,e=>{msg.textContent='GLB 로딩 실패: statue_of_liberty_1.glb 파일명·위치를 확인하세요.';console.error(e)});
const ids=['yaw','height','posX','posY'];ids.forEach(id=>document.getElementById(id).addEventListener('input',()=>{yaw=+document.getElementById('yaw').value;modelHeight=+document.getElementById('height').value;modelX=+document.getElementById('posX').value;modelY=+document.getElementById('posY').value;document.getElementById('yawVal').textContent=yaw+'°';document.getElementById('heightVal').textContent=modelHeight;applyModel()}));
document.getElementById('left').onclick=()=>{document.getElementById('yaw').value=Math.max(-180,yaw-10);document.getElementById('yaw').dispatchEvent(new Event('input'))};document.getElementById('right').onclick=()=>{document.getElementById('yaw').value=Math.min(180,yaw+10);document.getElementById('yaw').dispatchEvent(new Event('input'))};
let tx=0,ty=0,zoom=0.70,rotation=0,placing=false;function transform(){content.style.transform=`translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) rotate(${rotation}deg) scale(${zoom})`}transform();
document.getElementById('plus').onclick=()=>{zoom=Math.min(2.5,zoom*1.12);transform()};document.getElementById('minus').onclick=()=>{zoom=Math.max(.35,zoom/1.12);transform()};document.getElementById('reset').onclick=()=>{tx=ty=rotation=0;zoom=.70;transform();['yaw','height','posX','posY'].forEach((id,i)=>{document.getElementById(id).value=[-119,820,425,760][i]});document.getElementById('yaw').dispatchEvent(new Event('input'))};
let stream=null;document.getElementById('camera').onclick=async()=>{const v=document.getElementById('video');if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;v.style.display='none';document.getElementById('camera').textContent='📷 카메라 켜기';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=stream;v.style.display='block';await v.play();document.getElementById('camera').textContent='📷 카메라 끄기'}catch(e){msg.style.display='block';msg.textContent='카메라 실행 실패: HTTPS 접속과 카메라 권한을 확인하세요.'}};
document.getElementById('place').onclick=()=>{placing=true;msg.style.display='block';msg.textContent='배치할 위치를 화면에서 터치하세요.'};
const pointers=new Map();let lastCenter=null,lastDistance=null,lastAngle=null;
function geom(){const a=[...pointers.values()];if(a.length===1)return {x:a[0].x,y:a[0].y};if(a.length>=2){const x=(a[0].x+a[1].x)/2,y=(a[0].y+a[1].y)/2;return{x,y,d:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y),a:Math.atan2(a[1].y-a[0].y,a[1].x-a[0].x)}}return null}
viewer.addEventListener('pointerdown',e=>{if(placing){const r=viewer.getBoundingClientRect();tx=e.clientX-r.left-r.width/2;ty=e.clientY-r.top-r.height/2;placing=false;msg.style.display='none';transform();return}viewer.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const g=geom();lastCenter=g;lastDistance=g?.d??null;lastAngle=g?.a??null});viewer.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const g=geom();if(lastCenter){tx+=g.x-lastCenter.x;ty+=g.y-lastCenter.y}if(g.d&&lastDistance){zoom=Math.max(.35,Math.min(2.5,zoom*g.d/lastDistance));rotation+=(g.a-lastAngle)*180/Math.PI}lastCenter=g;lastDistance=g.d??null;lastAngle=g.a??null;transform()});function release(e){pointers.delete(e.pointerId);const g=geom();lastCenter=g;lastDistance=g?.d??null;lastAngle=g?.a??null}viewer.addEventListener('pointerup',release);viewer.addEventListener('pointercancel',release);
renderer.setAnimationLoop(()=>renderer.render(scene,cam));
</script></body></html>
