<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>자유의 여신상 | 스마트폰 테두리 돌출 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 25%,#273951,#0a111e 75%);color:#fff;font-family:system-ui,"Malgun Gothic",sans-serif;min-height:100dvh}
header{text-align:center;padding:20px 12px 0}h1{font-size:clamp(20px,4vw,30px);margin:0 0 7px}p{color:#bdcce0;margin:5px}
#stage{position:relative;width:min(96vw,1100px);height:min(66vh,660px);min-height:340px;margin:10px auto;overflow:hidden;touch-action:pan-y}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#notice{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);background:#122238e8;border:1px solid #6f8eaf;border-radius:12px;padding:15px 18px;max-width:85%;text-align:center;line-height:1.6;pointer-events:none}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:0 12px 16px}
button{border:1px solid #6486a7;background:#203a55;color:white;padding:11px 15px;border-radius:10px;font-size:14px;cursor:pointer}
button:hover{background:#315a7f}.small{text-align:center;font-size:12px;padding:0 12px 25px}
</style>
</head>
<body>
<header><h1>🗽 스마트폰 테두리 밖으로 솟아오른 자유의 여신상</h1><p>Pop-out 3D Illusion · 테두리 걸침형</p></header>
<div id="stage"><canvas id="scene"></canvas><div id="notice">3D 모델을 불러오는 중입니다…</div></div>
<div class="controls">
<button id="reset">처음 위치</button><button id="left">↶ 왼쪽 회전</button><button id="right">↷ 오른쪽 회전</button>
<button id="plus">＋ 확대</button><button id="minus">－ 축소</button><button id="frame">테두리 표시/숨김</button>
</div>
<p class="small">마우스 드래그/손가락으로 여신상 회전 · 휠/두 손가락으로 확대·축소<br>※ 브라우저 안의 가상 스마트폰에서 구현하는 원근 착시입니다. 실제 기기 화면 밖에 표시되는 것은 아닙니다.</p>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const stage=document.getElementById('stage'), canvas=document.getElementById('scene'), notice=document.getElementById('notice');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(36,1,.1,100);
camera.position.set(7.5,9.3,15);camera.lookAt(0,1.2,0);
scene.add(new THREE.HemisphereLight(0xeaf5ff,0x35435b,2.1));
const key=new THREE.DirectionalLight(0xfff2dc,3.2);key.position.set(-4,11,8);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-12;key.shadow.camera.right=12;key.shadow.camera.top=12;key.shadow.camera.bottom=-12;scene.add(key);
const fill=new THREE.DirectionalLight(0x79b6ff,1.5);fill.position.set(5,5,-6);scene.add(fill);
function mat(color,metalness=0,roughness=.7){return new THREE.MeshStandardMaterial({color,metalness,roughness})}
const phone=new THREE.Group();scene.add(phone);
const shell=new THREE.Mesh(new THREE.BoxGeometry(11.5,.36,6.4),mat(0x919ca9,.75,.25));shell.position.y=-.32;shell.receiveShadow=true;phone.add(shell);
const glass=new THREE.Mesh(new THREE.BoxGeometry(11.2,.045,6.12),mat(0x080e19,.2,.12));glass.position.y=-.105;phone.add(glass);
const ocean=new THREE.Mesh(new THREE.PlaneGeometry(10.9,5.82),new THREE.MeshStandardMaterial({color:0x08759c,roughness:.6,metalness:.1}));ocean.rotation.x=-Math.PI/2;ocean.position.y=-.072;ocean.receiveShadow=true;phone.add(ocean);
const island=new THREE.Mesh(new THREE.CylinderGeometry(2.05,2.25,.075,48),mat(0x548c65));island.scale.z=.72;island.position.set(-.4,-.016,.05);island.receiveShadow=true;phone.add(island);
const rim=new THREE.Mesh(new THREE.BoxGeometry(11.4,.07,6.32),new THREE.MeshBasicMaterial({color:0x0d1420,wireframe:true}));rim.position.y=-.08;phone.add(rim);
const home=new THREE.Mesh(new THREE.CircleGeometry(.11,24),new THREE.MeshBasicMaterial({color:0x131d29}));home.rotation.x=-Math.PI/2;home.position.set(5.38,-.04,0);phone.add(home);
const base=new THREE.Group();scene.add(base);base.position.set(-.4,.03,.4);
const pedestal=new THREE.Mesh(new THREE.BoxGeometry(1.55,.43,1.55),mat(0x999f95));pedestal.position.y=.21;pedestal.castShadow=true;pedestal.receiveShadow=true;base.add(pedestal);
const platform=new THREE.Mesh(new THREE.BoxGeometry(1.85,.12,1.85),mat(0x777f77));platform.position.y=.07;platform.castShadow=true;base.add(platform);
const statuePivot=new THREE.Group();statuePivot.position.y=.43;base.add(statuePivot);
let model=null,angle=0,scale=1;
function fallback(){
 const g=new THREE.Group(),green=mat(0x74a997,.25,.8);
 const body=new THREE.Mesh(new THREE.ConeGeometry(.63,2.9,12),green);body.position.y=1.65;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.36,18,12),green);head.position.y=3.33;g.add(head);
 const crown=new THREE.Mesh(new THREE.CylinderGeometry(.4,.37,.18,12),green);crown.position.y=3.65;g.add(crown);
 for(let i=0;i<7;i++){const a=i*Math.PI*2/7;const spike=new THREE.Mesh(new THREE.ConeGeometry(.075,.62,6),green);spike.position.set(Math.cos(a)*.43,3.96,Math.sin(a)*.43);spike.rotation.z=-Math.cos(a)*.55;spike.rotation.x=Math.sin(a)*.55;g.add(spike)}
 const arm=new THREE.Mesh(new THREE.CylinderGeometry(.14,.19,2.3,10),green);arm.position.set(-.65,3.45,0);arm.rotation.z=-.28;g.add(arm);
 const torch=new THREE.Mesh(new THREE.CylinderGeometry(.17,.13,.65,10),green);torch.position.set(-.98,4.75,0);g.add(torch);
 const flame=new THREE.Mesh(new THREE.ConeGeometry(.22,.62,12),mat(0xffc348,.4,.2));flame.position.set(-.98,5.35,0);g.add(flame);
 return g;
}
function mount(g){
 model=g;statuePivot.add(g);
 const box=new THREE.Box3().setFromObject(g),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
 const s=5.2/Math.max(size.y,.01);g.scale.setScalar(s);g.position.set(-center.x*s,-box.min.y*s,-center.z*s);
 g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 notice.style.display='none';
}
const loader=new GLTFLoader();
loader.load('./statue_of_liberty_1.glb',gltf=>mount(gltf.scene),progress=>{if(progress.total>0)notice.textContent=`3D 모델 불러오는 중… ${Math.round(progress.loaded/progress.total*100)}%`;},err=>{
 console.warn('GLB 로드 실패:',err);
 mount(fallback());
 notice.style.display='block';notice.textContent='GLB 로딩 실패: 임시 모형 표시 중. 저장소 최상위의 statue_of_liberty_1.glb 파일명과 업로드 여부를 확인하세요.';
});
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();camera.position.set(7.5,9.3,w<600?19:15);camera.lookAt(0,1.15,0)}
new ResizeObserver(resize).observe(stage);resize();
function update(){statuePivot.rotation.y=angle;statuePivot.scale.setScalar(scale)}
document.getElementById('reset').onclick=()=>{angle=0;scale=1;update()};
document.getElementById('left').onclick=()=>{angle-=.2;update()};
document.getElementById('right').onclick=()=>{angle+=.2;update()};
document.getElementById('plus').onclick=()=>{scale=Math.min(1.8,scale*1.12);update()};
document.getElementById('minus').onclick=()=>{scale=Math.max(.55,scale/1.12);update()};
document.getElementById('frame').onclick=()=>{shell.visible=!shell.visible;glass.visible=shell.visible;rim.visible=shell.visible;home.visible=shell.visible};
let down=false,lastX=0;
canvas.addEventListener('pointerdown',e=>{down=true;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(down){angle+=(e.clientX-lastX)*.009;lastX=e.clientX;update()}});
canvas.addEventListener('pointerup',()=>down=false);canvas.addEventListener('pointercancel',()=>down=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.55,Math.min(1.8,scale*(e.deltaY<0?1.06:.94)));update()},{passive:false});
let pinch=null;canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)scale=Math.max(.55,Math.min(1.8,scale*d/pinch));pinch=d;update()}},{passive:false});
canvas.addEventListener('touchend',()=>pinch=null);
renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></body></html>
