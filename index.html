<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자유의 여신상 | 카메라 Pop-out 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#101824;color:#fff;font-family:system-ui,'Malgun Gothic',sans-serif}header{text-align:center;padding:12px 6px}h1{font-size:clamp(17px,3.5vw,25px);margin:3px}header p{font-size:12px;color:#b9cee1;margin:4px}.viewport{position:relative;margin:auto;width:min(100vw,1100px);height:min(73dvh,680px);min-height:350px;background:linear-gradient(135deg,#22364e,#080d15);overflow:hidden;touch-action:none;border:1px solid #334d64;border-radius:9px}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.viewport.camera-on video{display:block}.viewport.camera-on{background:#101820}.overlay{position:absolute;width:min(90%,850px);aspect-ratio:3/2;left:50%;top:50%;transform:translate(-50%,-50%) rotate(0deg) scale(1);transform-origin:center;touch-action:none;user-select:none;will-change:transform;filter:drop-shadow(0 12px 15px #0006)}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.overlay canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}.status{position:absolute;top:8px;left:8px;right:8px;width:max-content;max-width:95%;padding:7px 10px;background:#071b31d9;border-radius:8px;font-size:12px;pointer-events:none;z-index:2}.toolbar{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;padding:12px 8px}button{background:#274966;border:1px solid #6d91af;color:white;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px}button:disabled{opacity:.45}.note{text-align:center;color:#b5c8da;font-size:12px;line-height:1.65;padding:0 12px 18px}.viewport.placing{cursor:crosshair}.viewport.placing:after{content:'배치할 위치를 터치하세요';position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#092b49d9;padding:9px 12px;border-radius:8px;pointer-events:none;white-space:nowrap}
</style></head><body><header><h1>🗽 자유의 여신상 · 스마트폰 Pop-out 3D</h1><p>뉴욕 항구 배경 + GLB 모델 · 카메라 배치 · 회전 · 확대/축소</p></header><div id="viewport" class="viewport"><video id="video" autoplay playsinline muted></video><div id="overlay" class="overlay"><img class="photo" src="./liberty-phone-background.png" alt="자유의 여신상이 제거된 스마트폰과 뉴욕 항구 배경"><canvas id="gl"></canvas></div><div id="status" class="status">3D 모델 준비 중…</div></div><div class="toolbar"><button id="camera">📷 카메라 켜기</button><button id="place">📍 위치 배치</button><button id="motion">📱 기울기 회전</button><button id="left">↶ 회전</button><button id="right">↷ 회전</button><button id="plus">＋ 확대</button><button id="minus">－ 축소</button><button id="reset">처음 위치</button></div><div class="note">한 손가락 드래그: 전체 이동 · 두 손가락: 전체 확대/축소 및 회전<br>카메라 사용에는 HTTPS와 카메라 권한이 필요합니다. 기울기 회전은 지원되는 기기에서만 작동합니다.<br>※ 화면 합성형 체험이며 실제 공간 추적·고정형 AR은 아닙니다.</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const viewport=document.getElementById('viewport'),overlay=document.getElementById('overlay'),video=document.getElementById('video'),status=document.getElementById('status');
const canvas=document.getElementById('gl');let stream=null,placing=false,motion=false,baseMotion=null;
const state={x:0,y:0,scale:1,rotation:0,tilt:0};
function show(s){status.textContent=s}function renderCSS(){overlay.style.transform=`translate(calc(-50% + ${state.x}px),calc(-50% + ${state.y}px)) rotate(${state.rotation+state.tilt}deg) scale(${state.scale})`}
function reset(){Object.assign(state,{x:0,y:0,scale:1,rotation:0,tilt:0});baseMotion=null;renderCSS()}function zoom(v){state.scale=Math.max(.3,Math.min(3.5,state.scale*v));renderCSS()}
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x000000,0);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-8,8,5.333,-5.333,.1,100);camera.position.set(0,0,22);camera.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x506575,2.5));const light=new THREE.DirectionalLight(0xfff1d9,3);light.position.set(-5,8,10);scene.add(light);const fill=new THREE.DirectionalLight(0xb2d9ff,1.3);fill.position.set(5,1,6);scene.add(fill);
const pivot=new THREE.Group();scene.add(pivot);
// 배경 원본(1536×1024) 기준: 여신상 받침대가 놓일 예상 지점은 화면 가로 약 34%, 세로 약 77%.
// 모델 크기와 좌표는 GLB마다 다르므로 이 수치는 최초 배치용입니다.
const anchor={u:.34,v:.79,height:.74};
function layoutModel(){const w=overlay.clientWidth,h=overlay.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.left=-8;camera.right=8;camera.top=8*h/w;camera.bottom=-8*h/w;camera.updateProjectionMatrix();pivot.position.set((anchor.u-.5)*16,(.5-anchor.v)*16*h/w,0)}
new ResizeObserver(layoutModel).observe(overlay);
function loadModel(){new GLTFLoader().load('./statue_of_liberty_1.glb',g=>{const root=g.scene,box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());if(size.y<.001)throw Error('GLB 크기가 올바르지 않습니다');const targetHeight=16*anchor.height*(overlay.clientHeight/overlay.clientWidth);const factor=targetHeight/size.y;root.scale.setScalar(factor);root.position.set(-center.x*factor,-box.min.y*factor,-center.z*factor);pivot.add(root);show('준비 완료 · 카메라를 켜거나 화면을 움직여 보세요');},undefined,e=>{console.error(e);show('GLB 로드 실패: statue_of_liberty_1.glb 파일명과 저장 위치를 확인하세요')})}
// 첫 로딩 시 이미지 비율(3:2)을 기준으로 GLB를 정규화. 이후 리사이즈 시 전체 화면 비율에 따라 함께 축소/확대.
layoutModel();loadModel();renderer.setAnimationLoop(()=>renderer.render(scene,camera));
const pointers=new Map();let lastCenter=null,lastDist=null,lastAngle=null;
function metrics(){const pts=[...pointers.values()];if(!pts.length)return null;const c={x:pts.reduce((s,p)=>s+p.x,0)/pts.length,y:pts.reduce((s,p)=>s+p.y,0)/pts.length};if(pts.length<2)return {...c,dist:null,angle:null};const a=pts[0],b=pts[1];return {...c,dist:Math.hypot(b.x-a.x,b.y-a.y),angle:Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI}}
viewport.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;if(placing){const r=viewport.getBoundingClientRect();state.x=e.clientX-(r.left+r.width/2);state.y=e.clientY-(r.top+r.height/2);placing=false;viewport.classList.remove('placing');renderCSS();show('위치 배치 완료 · 드래그/두 손가락으로 조작');return}pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});viewport.setPointerCapture(e.pointerId);const m=metrics();lastCenter=m;lastDist=m.dist;lastAngle=m.angle});
viewport.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const m=metrics();if(lastCenter){state.x+=m.x-lastCenter.x;state.y+=m.y-lastCenter.y}if(m.dist!==null&&lastDist!==null&&lastDist>0){state.scale=Math.max(.3,Math.min(3.5,state.scale*m.dist/lastDist));let d=m.angle-lastAngle;if(d>180)d-=360;if(d< -180)d+=360;state.rotation+=d}lastCenter=m;lastDist=m.dist;lastAngle=m.angle;renderCSS()});
function end(e){pointers.delete(e.pointerId);const m=metrics();lastCenter=m;lastDist=m?.dist??null;lastAngle=m?.angle??null}viewport.addEventListener('pointerup',end);viewport.addEventListener('pointercancel',end);
viewport.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.07:1/1.07)},{passive:false});
document.getElementById('camera').onclick=async()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;viewport.classList.remove('camera-on');document.getElementById('camera').textContent='📷 카메라 켜기';show('카메라 종료 · 배경과 GLB는 계속 표시됩니다');return}try{if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPS 및 카메라 지원 브라우저가 필요합니다');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;await video.play();viewport.classList.add('camera-on');document.getElementById('camera').textContent='📷 카메라 끄기';state.scale=.72;renderCSS();show('카메라 실행 중 · 위치 배치를 누르고 화면을 터치하세요')}catch(e){show('카메라 오류: '+e.message)}};
document.getElementById('place').onclick=()=>{placing=true;viewport.classList.add('placing');show('원하는 위치를 화면에서 터치하세요')};
document.getElementById('left').onclick=()=>{state.rotation-=10;renderCSS()};document.getElementById('right').onclick=()=>{state.rotation+=10;renderCSS()};document.getElementById('plus').onclick=()=>zoom(1.12);document.getElementById('minus').onclick=()=>zoom(1/1.12);document.getElementById('reset').onclick=()=>{reset();show('처음 위치로 복원했습니다')};
function orientation(e){if(!motion||e.gamma==null)return;if(baseMotion===null)baseMotion=e.gamma;state.tilt=Math.max(-35,Math.min(35,(e.gamma-baseMotion)*.65));renderCSS()}
document.getElementById('motion').onclick=async()=>{if(motion){motion=false;state.tilt=0;renderCSS();document.getElementById('motion').textContent='📱 기울기 회전';show('기울기 회전 종료');return}try{if(typeof DeviceOrientationEvent==='undefined')throw Error('기기 방향 센서를 지원하지 않습니다');if(typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw Error('기울기 센서 권한이 거부되었습니다')}motion=true;baseMotion=null;window.addEventListener('deviceorientation',orientation);document.getElementById('motion').textContent='📱 기울기 끄기';show('기울기 회전 사용 중 · 기기를 좌우로 기울여 보세요')}catch(e){show('기울기 기능: '+e.message)}};
</script></body></html>
